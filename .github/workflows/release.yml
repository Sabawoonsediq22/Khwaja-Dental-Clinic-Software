name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles updater"
            updater_platform: "darwin-aarch64"
            updater_file_pattern: "*.app.tar.gz"
            updater_sig_pattern: "*.app.tar.gz.sig"
          - platform: "ubuntu-22.04"
            args: "--bundles updater"
            updater_platform: "linux-x86_64"
            updater_file_pattern: "*.AppImage.tar.gz"
            updater_sig_pattern: "*.AppImage.tar.gz.sig"
          - platform: "windows-latest"
            args: "--bundles updater"
            updater_platform: "windows-x86_64"
            updater_file_pattern: "*.nsis.zip"
            updater_sig_pattern: "*.nsis.zip.sig"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dentix ${{ github.ref_name }}"
          releaseBody: "See the assets below for the installer."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: List bundle directory contents
        if: always()
        shell: bash
        run: |
          if echo "${{ matrix.args }}" | grep -q "\-\-target"; then
            TARGET_TRIPLE=$(echo "${{ matrix.args }}" | sed 's/.*--target //' | awk '{print $1}')
            BUNDLE_DIR="src-tauri/target/$TARGET_TRIPLE/release/bundle"
          else
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi
          echo "=== Bundle directory: $BUNDLE_DIR ==="
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f | sort
          else
            echo "Bundle directory not found!"
          fi

      - name: Upload updater artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Determine the correct bundle directory based on build target
          if echo "${{ matrix.args }}" | grep -q "\-\-target"; then
            TARGET_TRIPLE=$(echo "${{ matrix.args }}" | sed 's/.*--target //')
            UPLOADER_DIR="src-tauri/target/$TARGET_TRIPLE/release/bundle"
          else
            UPLOADER_DIR="src-tauri/target/release/bundle"
          fi

          echo "Bundle directory: $UPLOADER_DIR"

          if [ ! -d "$UPLOADER_DIR" ]; then
            echo "Warning: Bundle directory not found, skipping updater upload"
            exit 0
          fi

          # Upload updater file
          UPDATER_FILE=$(find "$UPLOADER_DIR" -name "${{ matrix.updater_file_pattern }}" 2>/dev/null | head -1)
          if [ -n "$UPDATER_FILE" ]; then
            echo "Uploading updater file: $UPDATER_FILE"
            gh release upload "$TAG" "$UPDATER_FILE" --clobber
          else
            echo "Warning: No updater file matching ${{ matrix.updater_file_pattern }} found"
          fi

          # Upload signature file
          UPDATER_SIG=$(find "$UPLOADER_DIR" -name "${{ matrix.updater_sig_pattern }}" 2>/dev/null | head -1)
          if [ -n "$UPDATER_SIG" ]; then
            echo "Uploading signature file: $UPDATER_SIG"
            gh release upload "$TAG" "$UPDATER_SIG" --clobber
          else
            echo "Warning: No signature file matching ${{ matrix.updater_sig_pattern }} found"
          fi

  finalize-latest-json:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create latest.json for all platforms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          export TAG="${GITHUB_REF#refs/tags/}"
          export VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")

          echo "Creating latest.json for v$VERSION (tag: $TAG)"

          # Fetch all release asset names
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Release assets:"
          echo "$ASSETS"

          # Write node script to file to avoid heredoc issues
          cat > create-latest-json.cjs << 'JSEOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const TAG = process.env.TAG;
          const VERSION = process.env.VERSION;
          const REPO_URL = `https://github.com/Sabawoonsediq22/Khwaja-Dental-Clinic-Software/releases/download/${TAG}`;

          const assets = execSync(`gh release view ${TAG} --json assets --jq ".assets[].name"`, { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);

          console.log('Assets found:', assets.length);

          function findAsset(patterns) {
            for (const pattern of patterns) {
              const re = new RegExp(pattern);
              const found = assets.find(a => re.test(a));
              if (found) return found;
            }
            return null;
          }

          function readSignature(filename) {
            if (!filename) return '';
            try {
              return execSync(`gh release download ${TAG} -p "${filename}" -O -`, { encoding: 'utf8' }).trim().replace(/\r?\n/g, '');
            } catch (e) {
              console.warn(`Warning: Could not read signature for ${filename}`);
              return '';
            }
          }

          const platforms = {};

          const macUpdater = findAsset([
            '^Dentix_.*\\.app\\.tar\\.gz$',
            '^Dentix\\.app\\.tar\\.gz$',
            '.*\\.app\\.tar\\.gz$'
          ]);
          const macSig = findAsset([
            '^Dentix_.*\\.app\\.tar\\.gz\\.sig$',
            '^Dentix\\.app\\.tar\\.gz\\.sig$',
            '.*\\.app\\.tar\\.gz\\.sig$'
          ]);
          if (macUpdater) {
            platforms['darwin-aarch64'] = {
              signature: readSignature(macSig),
              url: `${REPO_URL}/${macUpdater}`
            };
            console.log(`Added darwin-aarch64: ${macUpdater}`);
          } else {
            console.log('Warning: macOS updater bundle not found');
          }

          const linuxUpdater = findAsset([
            '^Dentix_.*\\.AppImage\\.tar\\.gz$',
            '^Dentix\\.AppImage\\.tar\\.gz$',
            '.*\\.AppImage\\.tar\\.gz$'
          ]);
          const linuxSig = findAsset([
            '^Dentix_.*\\.AppImage\\.tar\\.gz\\.sig$',
            '.*\\.AppImage\\.tar\\.gz\\.sig$'
          ]);
          if (linuxUpdater) {
            platforms['linux-x86_64'] = {
              signature: readSignature(linuxSig),
              url: `${REPO_URL}/${linuxUpdater}`
            };
            console.log(`Added linux-x86_64: ${linuxUpdater}`);
          } else {
            console.log('Warning: Linux updater bundle not found');
          }

          const winUpdater = findAsset([
            '^Dentix_.*\\.nsis\\.zip$',
            '^Dentix\\.nsis\\.zip$',
            '.*\\.nsis\\.zip$'
          ]);
          const winSig = findAsset([
            '^Dentix_.*\\.nsis\\.zip\\.sig$',
            '.*\\.nsis\\.zip\\.sig$'
          ]);
          if (winUpdater) {
            platforms['windows-x86_64'] = {
              signature: readSignature(winSig),
              url: `${REPO_URL}/${winUpdater}`
            };
            console.log(`Added windows-x86_64: ${winUpdater}`);
          } else {
            console.log('Warning: Windows updater bundle not found');
          }

          const latest = {
            version: VERSION,
            notes: 'See the assets below for the installer.',
            pub_date: new Date().toISOString(),
            platforms
          };

          fs.writeFileSync('latest.json', JSON.stringify(latest, null, 2));
          console.log('latest.json created successfully with', Object.keys(platforms).length, 'platforms');
          JSEOF

          node create-latest-json.cjs

          echo "--- latest.json content ---"
          cat latest.json
          echo "---------------------------"

          # Upload latest.json to the release
          gh release upload "$TAG" latest.json --clobber
          echo "latest.json uploaded to release $TAG"
